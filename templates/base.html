<!DOCTYPE html>

{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}BiblioLearn{% endblock %}
    </title>

    <!-- Fichier CSS -->
    <link rel="stylesheet" href="{% static 'pages/style.css' %}">
</head>

<body>

    <!-- En-tête -->
    <header>
        <h1>BiblioLearn</h1>

        <!-- Menu de navigation -->
        <nav>
            <a href="{% url 'pages:accueil' %}">Accueil</a>

            <a href="{% url 'pages:a_propos' %}">À propos</a>

            <a href="{% url 'pages:contact' %}">Contact</a>
        </nav>
    </header>

    <!-- Contenu des pages filles -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pied de page -->
    <footer>
        <p>BiblioLearn · ESMA Marrakech</p>
        <p>Projet Django - TP N°1</p>
    </footer>

</body>

</html>
